# XcodeGen spec — the single source of truth for the Xcode project.
# Run `xcodegen generate` to produce Fusionha.xcodeproj (git-ignored).
name: Fusionha

options:
  bundleIdPrefix: org.elabx
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Builds are unsigned; Feather signs on-device with your own certificate.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  FusionhaKit:
    path: Packages/FusionhaKit

targets:
  Fusionha:
    type: application
    platform: iOS
    sources:
      # App/V2 is the v2 product's own code (FusionhaV2 below).
      - path: App
        excludes:
          - "V2/**"
      - Shared
    dependencies:
      - package: FusionhaKit
      - target: FusionhaWidgets
      - target: FusionhaNotificationService
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: fusionha
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Mona Sans (OFL, Shared/Fonts), the variable font unmodified: the display face,
        # set condensed and heavy in code (Theme.display).
        UIAppFonts:
          - MonaSansVF.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: org.elabx.fusionha
            CFBundleURLSchemes: [fusionha]
        UIBackgroundModes:
          - remote-notification
          - fetch
        # fusionha is self-hosted and often reached over plain http on a LAN.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: fusionha connects to your fusionha server on your local network.
    entitlements:
      path: App/Fusionha.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.org.elabx.fusionha
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.elabx.fusionha.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.elabx.fusionha
        PRODUCT_NAME: Fusionha
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      # CI only: taps the simulator's "Open in fusionha?" prompt for the
      # deep-link checks (scripts/deeplink_check.sh). Built by build-for-testing.
      testTargets: [FusionhaUITests]

  FusionhaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "V2/**"
      - Shared
    dependencies:
      - package: FusionhaKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: fusionha
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Mona Sans (OFL, Shared/Fonts), the variable font unmodified: the display face,
        # set condensed and heavy in code (Theme.display).
        UIAppFonts:
          - MonaSansVF.ttf
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Widgets/FusionhaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.elabx.fusionha
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.elabx.fusionha.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.elabx.fusionha.widgets
        SKIP_INSTALL: "YES"

  FusionhaNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: fusionha
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: NotificationService/FusionhaNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.elabx.fusionha
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.elabx.fusionha.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.elabx.fusionha.notification-service
        SKIP_INSTALL: "YES"

  # fusionha v2 (docs/v2.md): a second app beside v1, from the same sources plus
  # App/V2. Its own bundle ids, App Group, keychain namespace and URL scheme
  # (read at runtime by FusionhaKit's AppIdentity from the Info.plist keys
  # below). No push yet: no notification-service extension and no
  # aps-environment until the server accepts a per-device APNs topic.
  # Its version (2.0.<run>) is stamped by CI (scripts/app_version.sh).
  FusionhaV2:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "FusionhaApp.swift"
          - "Info.plist"
          - "Fusionha.entitlements"
      - Shared
    dependencies:
      - package: FusionhaKit
      - target: FusionhaV2Widgets
    info:
      path: App/V2/Info.plist
      properties:
        CFBundleDisplayName: fusionha v2
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FusionhaAppGroup: group.org.elabx.fusionha.v2
        FusionhaKeychainNamespace: org.elabx.fusionha.v2
        FusionhaURLScheme: fusionha2
        UIAppFonts:
          - MonaSansVF.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        # v2 runs in several windows (split screen; docs/v2.md, Multiple windows). v1 stays single-window.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: org.elabx.fusionha.v2
            CFBundleURLSchemes: [fusionha2]
        UIBackgroundModes:
          - fetch
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: fusionha connects to your fusionha server on your local network.
    entitlements:
      path: App/V2/FusionhaV2.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.elabx.fusionha.v2
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.elabx.fusionha.v2.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.elabx.fusionha.v2
        PRODUCT_NAME: FusionhaV2
        MARKETING_VERSION: "2.0.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) V2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconV2
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  FusionhaV2Widgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - "Info.plist"
          - "FusionhaWidgets.entitlements"
      - Shared
    dependencies:
      - package: FusionhaKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/V2/Info.plist
      properties:
        CFBundleDisplayName: fusionha v2
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FusionhaAppGroup: group.org.elabx.fusionha.v2
        FusionhaKeychainNamespace: org.elabx.fusionha.v2
        FusionhaURLScheme: fusionha2
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - MonaSansVF.ttf
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Widgets/V2/FusionhaV2Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.elabx.fusionha.v2
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.elabx.fusionha.v2.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.elabx.fusionha.v2.widgets
        MARKETING_VERSION: "2.0.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) V2"
        SKIP_INSTALL: "YES"

  FusionhaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Fusionha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.elabx.fusionha.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Fusionha

schemes:
  # v2's app (and its widgets). v1's Fusionha scheme comes from its target's
  # `scheme:` above and is unchanged.
  FusionhaV2:
    build:
      targets:
        FusionhaV2: all
    run:
      config: Debug
    archive:
      config: Release
