# XcodeGen spec — the single source of truth for the Xcode project.
# Run `xcodegen generate` to produce Fusionha.xcodeproj (git-ignored).
name: Fusionha

options:
  bundleIdPrefix: org.elabx
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    # 2.0.<run> since the cutover (scripts/app_version.sh), above v1's 1.1.<run>.
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Builds are unsigned; Feather signs on-device with your own certificate.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

packages:
  FusionhaKit:
    path: Packages/FusionhaKit

targets:
  # fusionha is the v2 app (docs/v2.md) since the cutover (owner, 2026-11-18):
  # App/V2's screens over the shared App sources, built with the `V2`
  # condition, under v1's bundle ids, App Group, keychain group, URL scheme,
  # icon and name, so installing it upgrades v1 in place and keeps the
  # sign-in, widgets and push. AppIdentity falls back to v1's values when the
  # Info.plist names none. Its version (2.0.<run>) is stamped by CI
  # (scripts/app_version.sh), above v1's last 1.1.<run>.
  Fusionha:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: FusionhaKit
      - target: FusionhaWidgets
      - target: FusionhaNotificationService
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: fusionha
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Mona Sans (OFL, Shared/Fonts), the variable font unmodified: the display face,
        # set condensed and heavy in code (Theme.display).
        UIAppFonts:
          - MonaSansVF.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Several windows (split screen; docs/v2.md, Multiple windows).
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: org.elabx.fusionha
            CFBundleURLSchemes: [fusionha]
        UIBackgroundModes:
          - remote-notification
          - fetch
        # ATS stays open on purpose: fusionha is self-hosted on any host, often over
        # plain http on a LAN, and an address typed as http:// must still work, so no
        # fixed exception-domain list can describe it. The rule is in code instead
        # (ServerAddress.candidates): a host that isn't local is tried over https
        # only, a failed certificate never falls back, and http to such a host is
        # used only when typed explicitly and is marked "Not encrypted".
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: fusionha connects to your fusionha server on your local network.
    entitlements:
      path: App/Fusionha.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.org.elabx.fusionha
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.elabx.fusionha.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.elabx.fusionha
        PRODUCT_NAME: Fusionha
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) V2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      # CI only: taps the simulator's "Open in fusionha?" prompt for the
      # deep-link checks (scripts/deeplink_check.sh), and drives the app from
      # the Home Screen (UITests/SceneRelaunchDriver). Built by build-for-testing.
      testTargets: [FusionhaUITests]

  FusionhaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    dependencies:
      - package: FusionhaKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: fusionha
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Mona Sans (OFL, Shared/Fonts), the variable font unmodified: the display face,
        # set condensed and heavy in code (Theme.display).
        UIAppFonts:
          - MonaSansVF.ttf
        # Open for self-hosted servers; see the app target above (ServerAddress.candidates).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Widgets/FusionhaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.elabx.fusionha
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.elabx.fusionha.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.elabx.fusionha.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) V2"
        SKIP_INSTALL: "YES"

  # Rich push (poster attachment).
  FusionhaNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: fusionha
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
        # Open for self-hosted servers; see the app target above (ServerAddress.candidates).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: NotificationService/FusionhaNotificationService.entitlements
      properties:
        com.apple.security.application-groups:
          - group.org.elabx.fusionha
        keychain-access-groups:
          - $(AppIdentifierPrefix)org.elabx.fusionha.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.elabx.fusionha.notification-service
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) V2"
        SKIP_INSTALL: "YES"

  FusionhaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Fusionha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.elabx.fusionha.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: Fusionha
