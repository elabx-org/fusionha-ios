name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FusionhaKit tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      # iPhone Duo needs apps built with Xcode 27.1 or later (older builds run
      # letterboxed on its inner display). GitHub ships it on the `xcode-27` image.
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Unit tests
        run: swift test --package-path Packages/FusionhaKit

  build:
    name: Build unsigned IPA
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # iPhone Duo needs apps built with Xcode 27.1 or later (older builds run
      # letterboxed on its inner display). GitHub ships it on the `xcode-27` image.
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # Feather only offers an update when the version string changes, so the
      # patch number is the CI run number: 1.1.0 in project.yml ships as 1.1.<run>.
      - name: Set version
        run: |
          BASE=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' project.yml | head -1)
          echo "APP_VERSION=${BASE%.*}.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Fusionha.xcodeproj \
            -scheme Fusionha \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION="$APP_VERSION" \
            build 2>&1 | tee xcodebuild.log || {
            # Compile errors as annotations, readable from the checks API without the raw log.
            grep -E ": error: " xcodebuild.log | sort -u | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Fusionha.app Payload/
          zip -qry Fusionha.ipa Payload
          ls -lh Fusionha.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Fusionha-unsigned-ipa
          path: Fusionha.ipa
          retention-days: 14

      # Every push to main (and every v* tag) becomes a GitHub release carrying
      # the IPA plus a Feather/AltStore source. Feed URL to add in Feather:
      #   https://github.com/elabx-org/fusionha-ios/releases/latest/download/source.json
      - name: Prepare release
        id: release
        if: github.event_name == 'push'
        run: |
          VERSION="$APP_VERSION"
          BUILD=${{ github.run_number }}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="build-$BUILD"; fi
          python3 scripts/make_source.py Fusionha.ipa "$TAG" "$VERSION" "$BUILD" source.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=fusionha $VERSION (build $BUILD)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: |
            Fusionha.ipa
            source.json
          generate_release_notes: true
          make_latest: true

  # Screenshots of every screen from the simulator, against a mock server that
  # serves a demo library (scripts/mock_server.py). Published to the
  # `screenshots` branch under the PR number (or `main`) so changes can be
  # compared with the web app.
  screenshots:
