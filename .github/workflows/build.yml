          shoot account-methods SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ACCOUNT=methods
          shoot detail-01-series-editions SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=8 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCOPE=HD-1080p SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCROLL=editions
          shoot detail-02-series-all SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=8 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCOPE=all SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCROLL=editions
          shoot detail-03-seasons SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=8 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCROLL=tabs
          shoot detail-04-files SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=8 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_TAB=files SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCROLL=tabs
          shoot detail-05-history SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=8 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_TAB=history SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCROLL=tabs
          shoot detail-06-searches SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=8 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_TAB=searches SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCROLL=tabs
          shoot detail-07-movie-hero SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=1
          shoot detail-08-movie-all SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=1 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCOPE=all SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCROLL=editions
          shoot detail-09-movie-4k SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=1 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCOPE=UHD-2160p SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCROLL=editions
          shoot detail-10-movie-editions-tab SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=1 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCROLL=tabs
          shoot detail-11-versions-matrix SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=9 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCOPE=all SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCROLL=editions
          shoot detail-12-interactive SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=8 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SHEET=search
