          shoot settings-1-list SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SETTINGS=list
          shoot settings-2-general SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SETTINGS=general
          shoot settings-3-metadata SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SETTINGS=metadata
          shoot settings-4-editions SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SETTINGS=editions
          shoot settings-5-releasefilters SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SETTINGS=releasefilters
          shoot settings-6-security SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SETTINGS=security
          shoot settings-7-notifications SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SETTINGS=notifications SIMCTL_CHILD_FUSIONHA_SCREENSHOT_PUSH_TOKEN=ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
          python3 scripts/mock_server.py 8766 requestor &
          R=http://127.0.0.1:8766
          D="SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=discover"
          shoot discover-01-trailers $D SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DISCOVER_SCROLL=trailers
          shoot discover-02-collections $D SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DISCOVER_SCROLL=collections
          shoot discover-03-filters $D SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DISCOVER_SCROLL=filters
          shoot discover-04-all $D SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DISCOVER_KIND=all
