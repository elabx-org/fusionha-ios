          # Accented (tinted Home Screen) layout, approximated in the app, and a
          # page whose reload timed out (retry line + diagnostic).
          shoot widgets-recent-accented SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_WIDGETS=recent SIMCTL_CHILD_FUSIONHA_SCREENSHOT_WIDGET_ACCENTED=1
          shoot widget-page-library-accented SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_WIDGET_PAGE=library SIMCTL_CHILD_FUSIONHA_SCREENSHOT_WIDGET_ACCENTED=1
          shoot widget-page-library-failed SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_WIDGET_PAGE=library SIMCTL_CHILD_FUSIONHA_SCREENSHOT_WIDGET_FAIL=1
          # Avatar menu › Widget diagnostics, over a sample run journal (read back from the keychain).
          shoot widget-diagnostics SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=library SIMCTL_CHILD_FUSIONHA_SCREENSHOT_WIDGET_DIAG=sample
          # Widget deep links, as a widget tap delivers them: cold (the link
          # launches the app) and warm (the app is up, even under a sheet).
          # The app's DEBUG probe logs each step to Caches/deeplink-log.txt.
          scripts/deeplink_check.sh "$UDID" "$S" shots
          for bg in flow web hub orbits grid aurora gradient; do
            shoot login-bg-$bg SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LOGIN=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LOGIN_BACKGROUND=$bg
          done
          shoot login-split-flow SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LOGIN=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LOGIN_BACKGROUND=flow SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LOGIN_LAYOUT=split
          shoot login-appearance-1 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SETTINGS=appearance SIMCTL_CHILD_FUSIONHA_SCREENSHOT_APPEARANCE_TAB=login
          shoot login-appearance-2-backgrounds SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SETTINGS=appearance SIMCTL_CHILD_FUSIONHA_SCREENSHOT_APPEARANCE_TAB=login "SIMCTL_CHILD_FUSIONHA_SCREENSHOT_APPEARANCE_SCROLL=Login background"
          # Add title v2: configure step (hero, versions, monitoring, 4K, grab timeline, TVDB-only, details push).
          A="SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD=1"
          ST="SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_PICK=66732 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_KIND=series"
          shoot add-01-series-hero $A $ST
          shoot add-02-series-details $A $ST SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_SCROLL=details
          shoot add-03-series-versions $A $ST SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_SCROLL=versions
          shoot add-04-series-monitor $A $ST SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_SCROLL=monitor
          shoot add-05-series-split-4k $A $ST SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_SPLIT=1 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_SCROLL=monitor
          shoot add-06-4k-check $A $ST SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_4K=1 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_SCROLL=versions
          shoot add-07-movie-upcoming $A SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_PICK=1170608 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_KIND=movie
          shoot add-08-movie-timeline $A SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_PICK=1170608 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_KIND=movie SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_SCROLL=monitor
          shoot add-09-movie-released $A SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_PICK=438631 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_KIND=movie SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_SCROLL=versions
          shoot add-10-tvdb-only $A SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_TVDB=81196 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_SCROLL=details
          shoot add-11-anime-monitor $A SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_PICK=1429 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_KIND=series SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_SCROLL=monitor
          shoot add-12-view-details $A SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_PICK=63639 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_KIND=series SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_DETAILS=1
          # App shell (0.4.140): the A–Z scroll thumb, setup progress, the poster
          # long-press sheet and the Living-logo sign-in, against a bigger library.
          python3 scripts/mock_server.py 8767 shell &
          sleep 2
          H=http://127.0.0.1:8767
          L="SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$H SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=library"
          # Warm-up launch: the first launch against a fresh mock is still loading at 9s.
          shoot shell-00-warmup $L && rm -f shots/shell-00-warmup.png
          shoot shell-01-library-setup-pill $L
          shoot shell-02-scroll-thumb $L SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SCRUB=thumb
          shoot shell-03-scrubbing $L SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SCRUB=S
          # A–Z scrub sweep: far jumps back and forth through the real drag path;
          # frames grabbed mid-sweep must never be light (the old white flash).
          # Then the finger lifts and the page scrolls normally under a main-thread
          # watchdog (App/Debug/HangWatchdog.swift): any stall over 1s, a main
          # thread that stays busy once the page is idle, or a check that never
          # finishes fails the job (the post-scrub freeze of build 1.1.150).
          mkdir -p sweep
          env $L SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SCRUB=sweep xcrun simctl launch --terminate-running-process \
            --stderr="$PWD/sweep/app.log" "$UDID" org.elabx.fusionha > /dev/null
          for i in $(seq 1 40); do grep -q "SCRUB-CHECK sweep" sweep/app.log 2>/dev/null && break; sleep 1; done
          sleep 2
          for i in $(seq -w 1 16); do
            xcrun simctl io "$UDID" screenshot "sweep/shell-03-sweep-$i.png" > /dev/null
            sips -Z 400 -s format bmp "sweep/shell-03-sweep-$i.png" --out "sweep/shell-03-sweep-$i.bmp" > /dev/null
          done
          for i in $(seq 1 60); do grep -q "SCRUB-CHECK scroll" sweep/app.log 2>/dev/null && break; sleep 1; done
          sleep 1
          for i in 1 2 3 4; do
            xcrun simctl io "$UDID" screenshot "sweep/shell-03-drift-$i.png" > /dev/null
            sips -Z 400 -s format bmp "sweep/shell-03-drift-$i.png" --out "sweep/shell-03-drift-$i.bmp" > /dev/null
            sleep 0.7
          done
          for i in $(seq 1 90); do grep -q "SCRUB-CHECK DONE" sweep/app.log 2>/dev/null && break; sleep 1; done
          cp sweep/shell-03-sweep-*.png sweep/shell-03-drift-*.png shots/
          sweep_failed=""
          python3 scripts/frame_check.py sweep/*.bmp > sweep/check.md || sweep_failed=1
          cat sweep/check.md | tee -a "$GITHUB_STEP_SUMMARY"
          hang_failed=""
          { echo; echo '### A–Z scrub hang check'; echo '```'; grep -E "SCRUB-CHECK|HANG" sweep/app.log | xcrun swift-demangle --simplified | cut -c1-220 || echo "(no output)"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q "^HANG" sweep/app.log && hang_failed="the idle main thread stayed busy (see the HANG lines)"
          grep -q "^HANG main thread has not answered" sweep/app.log && hang_failed="the main thread stalled over 1s (see the HANG lines)"
          grep -q "SCRUB-CHECK DONE" sweep/app.log || hang_failed="the scrub + scroll check never finished (app hung or crashed)"
          # Silhouette: one far jump, captured in-app two frames after it lands. It must
          # already show the grid (card frames, titles, HD/4K chips on dark poster frames).
          env $L SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SCRUB=jump xcrun simctl launch --terminate-running-process \
            --stderr="$PWD/sweep/jump.log" "$UDID" org.elabx.fusionha > /dev/null
          for i in $(seq 1 40); do grep -q "SCRUB-CHECK DONE" sweep/jump.log 2>/dev/null && break; sleep 1; done
          silhouette_failed=""
          for n in 0 1; do
            src=$(grep "SCRUB-CHECK snapshot silhouette-$n " sweep/jump.log | sed 's/^SCRUB-CHECK snapshot silhouette-[0-9] //')
            if [ -n "$src" ] && [ -f "$src" ]; then
              cp "$src" "shots/shell-03-jump-silhouette-$n.png"
              sips -Z 400 -s format bmp "$src" --out "sweep/jump-silhouette-$n.bmp" > /dev/null
            else
              silhouette_failed="no in-app capture for silhouette-$n"
            fi
          done
          { echo; echo '### A–Z jump silhouette'; grep "SCRUB-CHECK" sweep/jump.log || true; } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -z "$silhouette_failed" ]; then
            python3 scripts/frame_check.py --strict sweep/jump-silhouette-0.bmp > sweep/jump.md || silhouette_failed="the frame right after the jump is blank or light"
            cat sweep/jump.md | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          # The watchdog must catch a planted 2.5s main-thread stall, or the check above proves nothing.
          env $L SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SCRUB=hang-selftest xcrun simctl launch --terminate-running-process \
            --stderr="$PWD/sweep/selftest.log" "$UDID" org.elabx.fusionha > /dev/null
          for i in $(seq 1 40); do grep -q "SCRUB-CHECK DONE" sweep/selftest.log 2>/dev/null && break; sleep 1; done
          { echo '```'; grep -E "SCRUB-CHECK|HANG" sweep/selftest.log || echo "(no output)"; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q "^HANG main thread has not answered" sweep/selftest.log || hang_failed="the watchdog missed the planted stall in its self-test"
          shoot shell-04-setup-steps $L SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SETUP=steps
          shoot shell-05-setup-result $L SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SETUP=result
          shoot shell-06-setup-multi $L SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SETUP=multi
          shoot shell-07-poster-sheet SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=library SIMCTL_CHILD_FUSIONHA_SCREENSHOT_POSTER_SHEET=9
          shoot shell-08-poster-seasons SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=library SIMCTL_CHILD_FUSIONHA_SCREENSHOT_POSTER_SHEET=9 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_POSTER_PAGE=seasons
          shoot shell-09-poster-versions SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=library SIMCTL_CHILD_FUSIONHA_SCREENSHOT_POSTER_SHEET=1 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_POSTER_PAGE=versions
          shoot shell-10-login-living SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LOGIN=$H
          shoot shell-11-login-living-form SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LOGIN=$H SIMCTL_CHILD_FUSIONHA_SCREENSHOT_METHOD=fusionha
          shoot shell-12-settings-living SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$H SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SETTINGS=appearance SIMCTL_CHILD_FUSIONHA_SCREENSHOT_APPEARANCE_TAB=login "SIMCTL_CHILD_FUSIONHA_SCREENSHOT_APPEARANCE_SCROLL=Media morphs on the sign-in page"
          shoot shell-13-discover SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$H SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=discover SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DISCOVER_KIND=all
          shoot shell-14-stats $L SIMCTL_CHILD_FUSIONHA_SCREENSHOT_STATS=1
          shoot shell-15-stats-attention $L SIMCTL_CHILD_FUSIONHA_SCREENSHOT_STATS=attention
          # Title page mid-setup: the step strip under the hero and "Waiting for seasons from TVDB…".
          shoot shell-16-detail-setup-strip SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$H SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=103
          shoot shell-17-detail-seasons-waiting SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$H SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=103 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCROLL=tabs
          ls -l shots
          if [ -n "$sweep_failed" ]; then echo "::error::The A–Z scrub sweep painted a light frame (scripts/frame_check.py)"; exit 1; fi
          if [ -n "$silhouette_failed" ]; then echo "::error::A–Z jump silhouette: $silhouette_failed"; exit 1; fi
          if [ -n "$hang_failed" ]; then echo "::error::A–Z scrub hang check: $hang_failed"; exit 1; fi

      # Interactive (Manual) search results: The Matrix's HD edition against the
      # mock's 34-release list (mixed qualities, rejections, blocklisted rows,
      # torrent + usenet), then the rejected rows, the 4K tab, a grab, the
      # loading banner and the no-match state.
      - name: Interactive search screenshots
        run: |
          python3 scripts/mock_server.py 8766 &
          sleep 2
          UDID=$(xcrun simctl list devices booted -j | python3 -c '
          import json, sys
          print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds))')
          shoot() {
            name=$1; shift
            env "$@" xcrun simctl launch --terminate-running-process "$UDID" org.elabx.fusionha > /dev/null
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/$name.png" > /dev/null
          }
          I="SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=http://127.0.0.1:8766 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=1 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SCOPE=HD-1080p SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DETAIL_SHEET=search"
          shoot search-1-results $I
          shoot search-2-rejected $I SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SEARCH_VIEW=rejected
          shoot search-3-4k $I SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SEARCH_VIEW=4k
          shoot search-4-grabbed $I SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SEARCH_VIEW=grabbed
          shoot search-5-loading $I SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SEARCH_VIEW=loading
          shoot search-6-nomatch $I SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SEARCH_VIEW=nomatch
          ls -l shots/search-*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots
          retention-days: 14

      - name: Publish to the screenshots branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          DIR=${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          # Keep the iPhone Duo job's $DIR/duo/ (published separately).
          scripts/publish_shots.sh shots "$DIR" --keep-subdirs

  # iPhone Duo: the main screens folded, unfolded and half open, in portrait
  # and landscape, on an iPhone Duo simulator from Xcode 27.1. Poses are
  # pressed in the Simulator's Device Hub (scripts/duo_pose.js) since simctl
  # has no pose command. Published to the `screenshots` branch under
  # <pr-N|main>/duo/.
  # Best-effort: the simulator has taken the hosted runner down mid-capture, so
  # it never fails the run, and it only runs where the shots are reviewed.
  duo:
    name: iPhone Duo screenshots
    if: github.event_name != 'push'
    continue-on-error: true
    runs-on: xcode-27
    timeout-minutes: 100
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: iPhone Duo SDK probe
        continue-on-error: true
        run: |
          mkdir -p duo
          exec > >(tee duo/probe.txt) 2>&1
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          for f in $(find "$SDK/System/Library/Frameworks/SwiftUI.framework" "$SDK/System/Library/Frameworks/SwiftUICore.framework" -name '*.swiftinterface' 2>/dev/null | grep arm64-apple-ios-simulator); do
            echo "== $f"
            grep -n -E "reservedRegion|ReservedRegion|toolbarVerticalBehavior|ToolbarVerticalBehavior|toolbarVerticalEdge|onHingeChange|HingeState" "$f" | head -60
            # The region type itself, for its members.
            awk '/(struct|enum|class) (ReservedRegion|ReservedRegionKind|ReservedRegionOptions)[ <:{]/{p=1} p{print; n++} n>40{p=0; n=0}' "$f" | head -150
          done
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -i -E "duo|iphone 1[89]"
          echo "== Apps that can host the simulator UI"
          find "$(dirname "$(dirname "$(xcode-select -p)")")" /Applications /System/Applications -maxdepth 5 -name "*.app" 2>/dev/null | grep -i -E "simulator|device ?hub" | head -20
          echo "== simctl commands"
          xcrun simctl help 2>&1 | sed -n '/Subcommands/,$p'
          xcrun simctl help ui 2>&1 | head -40
          echo "== pose / hinge symbols"
          XC=$(dirname "$(dirname "$(xcode-select -p)")")
          for b in "$XC/Contents/Applications/DeviceHub.app/Contents/MacOS/"* \
                   /Library/Developer/PrivateFrameworks/CoreSimulator.framework/Versions/A/CoreSimulator \
                   "$XC"/Contents/Developer/Library/PrivateFrameworks/SimulatorKit.framework/Versions/A/SimulatorKit; do
            [ -f "$b" ] || continue
            echo "-- $b"
            strings -a "$b" | grep -E -i "pose|hinge|posture|fold(ed)?State|bookMode|closedState|setAngle" | sort -u | head -80
          done
          ls "$XC/Contents/Applications/DeviceHub.app/Contents/Resources" 2>/dev/null | head -40
          defaults read com.apple.DeviceHub 2>/dev/null | head -20 || true

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Fusionha.xcodeproj \
            -scheme Fusionha \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create the iPhone Duo simulator
        timeout-minutes: 30
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS 27.1"; then
            xcodebuild -downloadPlatform iOS -buildVersion 27.1 || xcodebuild -downloadPlatform iOS
          fi
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rts = [r for r in json.load(sys.stdin)["runtimes"] if r["platform"] == "iOS" and r["isAvailable"]]
          rts = [r for r in rts if tuple(map(int, r["version"].split(".")[:2])) >= (27, 1)] or rts
          print(sorted(rts, key=lambda r: [int(x) for x in r["version"].split(".")])[-1]["identifier"])')
          echo "Runtime $RUNTIME"
          UDID=$(xcrun simctl create "iPhone Duo" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Fusionha.app

      - name: Take iPhone Duo screenshots
        timeout-minutes: 55
        run: |
          python3 scripts/mock_server.py 8765 &
          sleep 2
          mkdir -p duo/shots
          cp duo/probe.txt duo/shots/ 2>/dev/null || true
          DEST=${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'main' }}/duo
          if [ "${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}" = true ]; then
            export DUO_PUBLISH="scripts/publish_shots.sh duo/shots $DEST"
          fi
          # Opening the Device Hub has twice taken the hosted runner down; off until poses work headless.
          export DUO_UI=0
          scripts/duo_shots.sh "$UDID" duo/shots || true
          # Unfolded proxy: a regular-width iPad mini (labelled standin-*-not-real-unfold).
          xcrun simctl shutdown "$UDID" || true
          scripts/duo_proxy.sh build/Build/Products/Debug-iphonesimulator/Fusionha.app duo/shots || true
          cat duo/shots/duo-poses.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-screenshots
          path: duo
          retention-days: 14

      - name: Publish to the screenshots branch
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          mkdir -p duo/shots
          cp duo/probe.txt duo/shots/ 2>/dev/null || true
          scripts/publish_shots.sh duo/shots ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'main' }}/duo

  # Drives the app through Activity (History at 1000+ events, Queue, Blocklist,
  # Tasks, Audit, Indexers) and Wanted against the mock server in volume mode,
  # with the DEBUG perf probe (App/Debug/PerfProbe.swift) and its in-app
  # main-thread sampler, then prints hitches, main-thread hangs, CPU and the
  # heaviest symbols per phase.
  # Optimised build (Release) with DEBUG set so the probe and mock hooks exist.
  perf:
    name: Activity perf
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5

      # iPhone Duo needs apps built with Xcode 27.1 or later (older builds run
      # letterboxed on its inner display). GitHub ships it on the `xcode-27` image.
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator (optimised, with the perf probe)
        run: |
          set -o pipefail
          xcodebuild \
            -project Fusionha.xcodeproj \
            -scheme Fusionha \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            ONLY_ACTIVE_ARCH=YES ARCHS=arm64 \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run the perf script
        timeout-minutes: 25
        run: |
          sudo DevToolsSecurity -enable || true
          mkdir -p perf
          python3 scripts/mock_server.py 8765 perf > perf/mock.log 2>&1 &
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for rt, ds in sorted(json.load(sys.stdin)["devices"].items(), reverse=True) if "iOS-27" in rt for d in ds]
          pick = next((d for d in devices if d["name"] in ("iPhone 18 Pro", "iPhone 17 Pro")), None) or next(d for d in devices if d["name"].startswith("iPhone") and "Duo" not in d["name"])
          print(pick["udid"])')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/Fusionha.app
          # Let the freshly booted simulator settle before measuring.
          sleep 20
          export SIMCTL_CHILD_FUSIONHA_PERF=1
          export SIMCTL_CHILD_FUSIONHA_PERF_DELAY=10
          export SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=http://127.0.0.1:8765
          export SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=library
          export SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ACTIVITY_TAB=history
          OUT=$(xcrun simctl launch --terminate-running-process --stderr="$PWD/perf/app.log" --stdout="$PWD/perf/app.out" "$UDID" org.elabx.fusionha)
          echo "$OUT"
          PID=$(echo "$OUT" | awk '{print $NF}')
          for i in $(seq 1 400); do
            grep -q "PERF DONE" perf/app.log 2>/dev/null && break
            sleep 1
          done
          grep "PERF" perf/app.log | grep -v "\"event\":\"stacks\"" || true
          grep -q "PERF DONE" perf/app.log || { echo "::error::perf script did not finish"; tail -50 perf/app.log; exit 1; }

      - name: Report
        if: always()
        run: |
          # Swift symbols from the in-app sampler come out mangled.
          python3 scripts/perf_report.py perf/app.log --json perf/summary.json \
            | xcrun swift-demangle --simplified | cut -c1-240 | tee perf/summary.txt
          { echo '## Activity perf'; echo '```'; cat perf/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activity-perf
          path: |
            perf/*.txt
            perf/*.json
            perf/*.log
            perf/*.out
          retention-days: 14
