      # letterboxed on its inner display). GitHub ships it on the `xcode-27` image.
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator (with the deep-link prompt helper)
        run: |
          set -o pipefail
          xcodebuild \
            -project Fusionha.xcodeproj \
            -scheme Fusionha \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing

      - name: Take screenshots
        run: |
          python3 scripts/mock_server.py 8765 &
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for rt, ds in sorted(json.load(sys.stdin)["devices"].items(), reverse=True) if "iOS-27" in rt for d in ds]
          pick = next((d for d in devices if d["name"] in ("iPhone 18 Pro", "iPhone 17 Pro")), None) or next(d for d in devices if d["name"].startswith("iPhone") and "Duo" not in d["name"])
          print(pick["udid"])')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Fusionha.app
          mkdir -p shots
          shoot() {
            name=$1; shift
            env "$@" xcrun simctl launch --terminate-running-process "$UDID" org.elabx.fusionha > /dev/null
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$name.png" > /dev/null
          }
          S=http://127.0.0.1:8765
          shoot 01-login SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LOGIN=
          shoot 02-login-methods SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LOGIN=$S
          shoot 03-login-form SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LOGIN=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_METHOD=fusionha
          shoot 04-library SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=library
