          shoot discover-15-add-as-menu $D SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DISCOVER_ADDAS=hybrid SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DISCOVER_ADDAS_OPEN=1
          shoot discover-10-requestor SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$R
