name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FusionhaKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Unit tests
        run: swift test --package-path Packages/FusionhaKit

  build:
    name: Build unsigned IPA
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # Feather only offers an update when the version string changes, so the
      # patch number is the CI run number: 1.1.0 in project.yml ships as 1.1.<run>.
      - name: Set version
        run: |
          BASE=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' project.yml | head -1)
          echo "APP_VERSION=${BASE%.*}.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Fusionha.xcodeproj \
            -scheme Fusionha \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION="$APP_VERSION" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Fusionha.app Payload/
          zip -qry Fusionha.ipa Payload
          ls -lh Fusionha.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Fusionha-unsigned-ipa
          path: Fusionha.ipa
          retention-days: 14

      # Every push to main (and every v* tag) becomes a GitHub release carrying
      # the IPA plus a Feather/AltStore source. Feed URL to add in Feather:
      #   https://github.com/elabx-org/fusionha-ios/releases/latest/download/source.json
      - name: Prepare release
        id: release
        if: github.event_name == 'push'
        run: |
          VERSION="$APP_VERSION"
          BUILD=${{ github.run_number }}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="build-$BUILD"; fi
          python3 scripts/make_source.py Fusionha.ipa "$TAG" "$VERSION" "$BUILD" source.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=fusionha $VERSION (build $BUILD)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: |
            Fusionha.ipa
            source.json
          generate_release_notes: true
          make_latest: true

  # Screenshots of every screen from the simulator, against a mock server that
  # serves a demo library (scripts/mock_server.py). Published to the
  # `screenshots` branch under the PR number (or `main`) so changes can be
  # compared with the web app.
  screenshots:
    name: Simulator screenshots
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Fusionha.xcodeproj \
            -scheme Fusionha \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Take screenshots
        run: |
          python3 scripts/mock_server.py 8765 &
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS-26" in rt for d in ds]
          pick = next((d for d in devices if d["name"] == "iPhone 17 Pro"), None) or next(d for d in devices if d["name"].startswith("iPhone"))
          print(pick["udid"])')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Fusionha.app
          mkdir -p shots
          shoot() {
            name=$1; shift
            env "$@" xcrun simctl launch --terminate-running-process "$UDID" org.elabx.fusionha > /dev/null
            sleep 9
            xcrun simctl io "$UDID" screenshot "shots/$name.png" > /dev/null
          }
          S=http://127.0.0.1:8765
          shoot 01-login SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LOGIN=
          shoot 02-login-methods SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LOGIN=$S
          shoot 03-login-form SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LOGIN=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_METHOD=fusionha
          shoot 04-library SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=library
          shoot 05-discover SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=discover
          shoot 06-calendar SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=calendar
          shoot 07-activity SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=activity
          shoot 08-wanted SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=wanted
          shoot 09-detail SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ITEM=8
          shoot 10-add SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD=1
          shoot 11-search SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SEARCH=ma
          python3 scripts/mock_server.py 8766 requestor &
          R=http://127.0.0.1:8766
          D="SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=discover"
          shoot discover-01-trailers $D SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DISCOVER_SCROLL=trailers
          shoot discover-02-collections $D SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DISCOVER_SCROLL=collections
          shoot discover-03-filters $D SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DISCOVER_SCROLL=filters
          shoot discover-04-all $D SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DISCOVER_KIND=all
          shoot discover-05-requests $D SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DISCOVER_TAB=requests
          shoot discover-06-issues $D SIMCTL_CHILD_FUSIONHA_SCREENSHOT_DISCOVER_TAB=issues
          shoot discover-07-preview $D SIMCTL_CHILD_FUSIONHA_SCREENSHOT_PREVIEW=movie/438631
          shoot discover-08-preview-series $D SIMCTL_CHILD_FUSIONHA_SCREENSHOT_PREVIEW=series/63639
          shoot discover-09-request $D SIMCTL_CHILD_FUSIONHA_SCREENSHOT_REQUEST=series/63639/The_Expanse
          shoot discover-10-requestor SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$R
          shoot discover-11-my-requests SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$R SIMCTL_CHILD_FUSIONHA_SCREENSHOT_REQUESTOR_TAB=requests
          shoot discover-12-you SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$R SIMCTL_CHILD_FUSIONHA_SCREENSHOT_REQUESTOR_TAB=you
          shoot library-shell-list SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=library SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LIST=1
          shoot library-shell-select SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=library SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SELECT=1
          shoot library-shell-toast SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=library SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TOAST=Monitoring\ Dune
          shoot library-shell-omni SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_TAB=calendar SIMCTL_CHILD_FUSIONHA_SCREENSHOT_OMNI=ma
          shoot library-shell-add-step1 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD=1
          shoot library-shell-add-step2 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD=1 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_PICK=1396
          shoot library-shell-add-step2-movie SIMCTL_CHILD_FUSIONHA_SCREENSHOT_SERVER=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD=1 SIMCTL_CHILD_FUSIONHA_SCREENSHOT_ADD_PICK=27205
          shoot library-shell-login-demo SIMCTL_CHILD_FUSIONHA_SCREENSHOT_LOGIN=$S SIMCTL_CHILD_FUSIONHA_SCREENSHOT_METHOD=demo
          ls -l shots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          retention-days: 14

      - name: Publish to the screenshots branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          DIR=${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -R shots "$RUNNER_TEMP/shots"
          git fetch -q origin screenshots:refs/remotes/origin/screenshots || true
          if git rev-parse -q --verify refs/remotes/origin/screenshots > /dev/null; then
            git switch -q -c publish refs/remotes/origin/screenshots
          else
            git switch -q --orphan publish
          fi
          rm -rf "$DIR" && mkdir -p "$DIR"
          cp "$RUNNER_TEMP"/shots/*.png "$DIR/"
          git add "$DIR"
          git commit -qm "Screenshots for $DIR (${GITHUB_SHA::7})" || exit 0
          git push -q origin publish:screenshots
