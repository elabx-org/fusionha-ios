name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FusionhaKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Unit tests
        run: swift test --package-path Packages/FusionhaKit

  build:
    name: Build unsigned IPA
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Fusionha.xcodeproj \
            -scheme Fusionha \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Fusionha.app Payload/
          zip -qry Fusionha.ipa Payload
          ls -lh Fusionha.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Fusionha-unsigned-ipa
          path: Fusionha.ipa
          retention-days: 14

      # Every push to main (and every v* tag) becomes a GitHub release carrying
      # the IPA plus a Feather/AltStore source. Feed URL to add in Feather:
      #   https://github.com/elabx-org/fusionha-ios/releases/latest/download/source.json
      - name: Prepare release
        id: release
        if: github.event_name == 'push'
        run: |
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' project.yml | head -1)
          BUILD=${{ github.run_number }}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="build-$BUILD"; fi
          python3 scripts/make_source.py Fusionha.ipa "$TAG" "$VERSION" "$BUILD" source.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=fusionha $VERSION (build $BUILD)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: |
            Fusionha.ipa
            source.json
          generate_release_notes: true
          make_latest: true
